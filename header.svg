<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="100%" height="260">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="50%" stop-color="#0B1120" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Text Gradient with Dynamic Shift -->
    <linearGradient id="title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8">
        <animate attributeName="stop-color" values="#38BDF8;#818CF8;#C084FC;#38BDF8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#818CF8">
        <animate attributeName="stop-color" values="#818CF8;#C084FC;#38BDF8;#818CF8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#C084FC">
        <animate attributeName="stop-color" values="#C084FC;#38BDF8;#818CF8;#C084FC" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Animated Border Neon Gradient -->
    <linearGradient id="neon-flow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0.8" />
    </linearGradient>

    <!-- Glow Gradients -->
    <radialGradient id="glow-cyan" cx="15%" cy="30%" r="55%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.38" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0" />
    </radialGradient>
    
    <radialGradient id="glow-purple" cx="88%" cy="75%" r="60%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.30" />
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glow-emerald" cx="50%" cy="100%" r="45%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#10B981" stop-opacity="0" />
    </radialGradient>

    <!-- Tech Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1E293B" stroke-width="0.75" stroke-opacity="0.45" />
    </pattern>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <style>
    .status-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-size: 11px; font-weight: 700; fill: #38BDF8; letter-spacing: 1.2px; }
    .title-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-size: 42px; font-weight: 800; letter-spacing: -0.6px; }
    .sub-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-size: 15px; font-weight: 500; fill: #94A3B8; letter-spacing: 0.2px; }
    .tag-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; font-size: 12px; font-weight: 600; fill: #CBD5E1; }
    .chip-bg { fill: #0F172A; fill-opacity: 0.85; stroke: #334155; stroke-width: 1; }
  </style>

  <!-- Container Box -->
  <rect width="900" height="260" rx="16" fill="url(#bg-grad)" stroke="#1E293B" stroke-width="1.5" />

  <!-- Ambient Glows -->
  <rect width="900" height="260" rx="16" fill="url(#glow-cyan)" />
  <rect width="900" height="260" rx="16" fill="url(#glow-purple)" />
  <rect width="900" height="260" rx="16" fill="url(#glow-emerald)" />

  <!-- Grid Overlay -->
  <rect width="900" height="260" rx="16" fill="url(#grid)" />

  <!-- Animated Glowing Top Border -->
  <rect x="30" y="0" width="840" height="2.5" rx="1.25" fill="url(#neon-flow)">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="3s" repeatCount="indefinite" />
  </rect>

  <!-- Decorative Tech Graphic (Right Side) with Micro-Pulse -->
  <g opacity="0.75" transform="translate(735, 30)">
    <circle cx="95" cy="20" r="4" fill="#38BDF8">
      <animate attributeName="r" values="3.5;5;3.5" dur="3s" repeatCount="indefinite" />
    </circle>
    <circle cx="115" cy="55" r="3" fill="#818CF8">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2.5s" repeatCount="indefinite" />
    </circle>
    <circle cx="70" cy="85" r="3.5" fill="#C084FC">
      <animate attributeName="r" values="3;4.5;3" dur="4s" repeatCount="indefinite" />
    </circle>
    <circle cx="105" cy="120" r="2.5" fill="#10B981">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite" />
    </circle>
    <path d="M 50 20 L 130 20" stroke="#334155" stroke-width="1" stroke-dasharray="4,4" />
    <path d="M 35 60 L 130 60" stroke="#334155" stroke-width="1" stroke-dasharray="3,3" />
    <path d="M 55 100 L 130 100" stroke="#334155" stroke-width="1" stroke-dasharray="4,4" />
    <path d="M 95 20 L 115 55 L 70 85 L 105 120" fill="none" stroke="#38BDF8" stroke-width="0.8" stroke-opacity="0.35" />
  </g>

  <!-- Content Group -->
  <g transform="translate(48, 0)">
    <!-- Status Pill -->
    <g transform="translate(0, 34)">
      <rect width="255" height="26" rx="13" fill="#0C4A6E" fill-opacity="0.55" stroke="#0284C7" stroke-width="1" />
      <circle cx="15" cy="13" r="4" fill="#38BDF8">
        <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite" />
      </circle>
      <text x="28" y="17" class="status-text">SYSTEMS &amp; PRODUCT ARCHITECT</text>
    </g>

    <!-- Main Title -->
    <g transform="translate(0, 102)">
      <text class="title-text" fill="url(#title-grad)" filter="url(#shadow)">Rafael | @rafa203gt</text>
    </g>

    <!-- Subtitle -->
    <g transform="translate(0, 138)">
      <text class="sub-text">Full-Stack Architect • Native iOS Engineer • Systems &amp; Autonomous MCP Developer</text>
    </g>

    <!-- Tech Highlight Chips (5 Pills) -->
    <g transform="translate(0, 182)">
      <!-- Pill 1: SwiftUI & iOS -->
      <g>
        <rect width="146" height="30" rx="15" class="chip-bg" />
        <text x="14" y="19" class="tag-text">📱 Swift &amp; SwiftUI</text>
      </g>
      <!-- Pill 2: TypeScript & React -->
      <g transform="translate(154, 0)">
        <rect width="168" height="30" rx="15" class="chip-bg" />
        <text x="14" y="19" class="tag-text">⚡ TypeScript &amp; React</text>
      </g>
      <!-- Pill 3: MCP & AI Agents -->
      <g transform="translate(330, 0)">
        <rect width="162" height="30" rx="15" class="chip-bg" />
        <text x="14" y="19" class="tag-text">🤖 MCP &amp; AI Agents</text>
      </g>
      <!-- Pill 4: C++ & Low-Level -->
      <g transform="translate(500, 0)">
        <rect width="144" height="30" rx="15" class="chip-bg" />
        <text x="14" y="19" class="tag-text">🦀 C++ &amp; Systems</text>
      </g>
      <!-- Pill 5: Resilient APIs -->
      <g transform="translate(652, 0)">
        <rect width="152" height="30" rx="15" class="chip-bg" />
        <text x="14" y="19" class="tag-text">☁️ Resilient Cloud</text>
      </g>
    </g>
  </g>
</svg>